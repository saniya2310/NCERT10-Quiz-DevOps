name: Deploy to AWS ECS Fargate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - dev
          - staging
          - prod
      image_tag:
        description: "Image tag to deploy (e.g., latest, sha-xxxx, v1.0.0)"
        required: true
        default: "latest"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC or Secret Keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActionsECSSession

      - name: Download Active Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ncert10-quiz-${{ github.event.inputs.environment }} \
            --query taskDefinition > task-definition.json

      - name: Render New Image in Task Definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: web
          image: ghcr.io/${{ github.repository }}:${{ github.event.inputs.image_tag }}

      - name: Deploy Amazon ECS Task Definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ncert10-quiz-${{ github.event.inputs.environment }}-service
          cluster: ncert10-quiz-${{ github.event.inputs.environment }}-cluster
          wait-for-service-stability: true
