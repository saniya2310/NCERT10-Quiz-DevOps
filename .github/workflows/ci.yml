name: CI Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Validate NCERT Question Bank
        run: npm run validate:bank

      - name: Lint Codebase (ESLint)
        run: npm run lint

      - name: Static Type Checking (TypeScript)
        run: npm run typecheck

      - name: Production Build
        run: npm run build

  security-scan:
    name: DevSecOps Vulnerability Scan
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Secret Scan with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Run Trivy Vulnerability Scanner (Repo & Dependencies)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "table"
          severity: "CRITICAL,HIGH"

  image:
    name: Container Build & Verification
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image (Dry Run)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ncert10-quiz:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
