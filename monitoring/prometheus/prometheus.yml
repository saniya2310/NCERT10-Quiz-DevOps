global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "ncert10-quiz"
    metrics_path: "/api/metrics"
    static_configs:
      - targets: ["web:3000"]
        labels:
          app: "boardready"
          env: "production"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
