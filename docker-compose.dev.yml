services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ncert10-quiz-dev
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      LEADERBOARD_PATH: /app/.data/leaderboard.json
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
